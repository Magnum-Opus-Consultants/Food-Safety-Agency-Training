# Apache on the Training Hub server: port 80 only. TLS is done by the edge proxy, which forwards over
# NetBird. Everything goes to the Next.js server, which passes /api on to Django.
<VirtualHost *:80>
    ServerName fsa-training-hub.netbird.cloud
    ServerAlias 10.0.0.131

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3210/ timeout=120
    ProxyPassReverse / http://127.0.0.1:3210/

    # Uploads are capped at 5 MB by the app; allow a little over for the form fields.
    LimitRequestBody 6291456

    ErrorLog ${APACHE_LOG_DIR}/fsa-training-hub-error.log
    CustomLog ${APACHE_LOG_DIR}/fsa-training-hub-access.log combined
</VirtualHost>
